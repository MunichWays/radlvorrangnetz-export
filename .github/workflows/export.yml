name: Build RadlVorrangNetz App GeoJSON

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"       # wöchentlich jeden Montag um 03:00 UTC (04 MEZ / 05 MESZ)
  #     - cron: "0 17 * * 0"       # wöchentlich jeden Sonntag um 17:00 UTC (18 MEZ / 19 MESZ)  
  #  - cron: "0 17 22-31 * 0"  # letzter Sonntag im Monat zwischen 22.–31. um 17:00 UTC (18 MEZ / 19 MESZ) → manchmal auch vorletzter 

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download input GeoJSON (webspace)
        run: |
          mkdir -p data
          curl -L --fail --retry 5 --retry-delay 3 \
            -o data/IST_RadlVorrangNetz_MunichWays_V20.geojson \
            "https://www.munichways.de/App/IST_RadlVorrangNetz_MunichWays_V20.geojson"

      - name: Run export (App V07)
        run: |
          python scripts/build_radlvorrangnetz_app_v07.py

      - name: Run export (ALL RadlVorrang-Netz Ist)
        run: |
          python scripts/build_all_radlvorrangnetz_ist.py

      - name: Run export (NUR RadlVorrang-Netz Ist)
        run: |
          python scripts/build_nur_radlvorrangnetz_ist.py          

      - name: Run export (Status Umsetzung)
        run: |
          python scripts/build_status_umsetzung.py

      - name: Run export (Ziel RadlVorrang-Netz)
        run: |
          python scripts/build_ziel_radlvorrangnetz.py

      - name: Run export (Kategorie Markierungen)
        run: |
          python scripts/build_kat_markierungen.py   

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geojson_exports
          if-no-files-found: error
          path: |
            data/radlvorrangnetz_app_V07.geojson
            data/ALL_RadlVorrangNetz_Ist.geojson
            data/NUR_RadlVorrangNetz_Ist.geojson
            data/Status_Umsetzung_Radentscheid.geojson
            data/ZIEL_RadlVorrangNetz.geojson
            data/Kategorie_Markierungen.geojson

      - name: Prepare FTP upload
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_TIME="$(date -u +'%Y-%m-%d_%H-%M-%S')"
          echo "DEPLOY_TIME=$DEPLOY_TIME" >> "$GITHUB_ENV"

          mkdir -p ftp-upload/current ftp-upload/save

          files=(
            radlvorrangnetz_app_V07.geojson
            ALL_RadlVorrangNetz_Ist.geojson
            NUR_RadlVorrangNetz_Ist.geojson
            Status_Umsetzung_Radentscheid.geojson
            ZIEL_RadlVorrangNetz.geojson
            Kategorie_Markierungen.geojson
          )

          for file in "${files[@]}"; do
            cp "data/$file" "ftp-upload/current/$file"
            cp "data/$file" "ftp-upload/save/${file%.geojson}_$DEPLOY_TIME.geojson"
          done

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Upload GeoJSON files to webspace
        shell: bash
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_PATH: .
          FTP_SAVE_PATH: /save
        run: |
          set -euo pipefail

          if [[ -z "$FTP_SERVER" || -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" ]]; then
            echo "::error::FTP_SERVER and FTP_USERNAME must be Repository Variables; FTP_PASSWORD must be a Repository Secret."
            exit 1
          fi

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no

          set cmd:fail-exit no
          mkdir -p "$FTP_SAVE_PATH"
          set cmd:fail-exit yes

          mirror --reverse --overwrite --verbose ftp-upload/current "$FTP_TARGET_PATH"
          mirror --reverse --overwrite --verbose ftp-upload/save "$FTP_SAVE_PATH"

          bye
          EOF

      - name: Verify FTP upload
        shell: bash
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_PATH: .
          FTP_SAVE_PATH: /save
        run: |
          set -euo pipefail

          files=(
            radlvorrangnetz_app_V07.geojson
            ALL_RadlVorrangNetz_Ist.geojson
            NUR_RadlVorrangNetz_Ist.geojson
            Status_Umsetzung_Radentscheid.geojson
            ZIEL_RadlVorrangNetz.geojson
            Kategorie_Markierungen.geojson
          )

          for file in "${files[@]}"; do
            backup="${file%.geojson}_$DEPLOY_TIME.geojson"

            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
            set cmd:fail-exit yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate yes
            set ssl:check-hostname no
            cls "$FTP_TARGET_PATH/$file"
            cls "$FTP_SAVE_PATH/$backup"
            bye
          EOF
          done

          echo "Successfully uploaded and verified ${#files[@]} current files and ${#files[@]} backups."
